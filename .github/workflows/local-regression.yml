name: IKF local regression

on:
  push:
    branches: [main]
    paths:
      - 'src/ikf/**'
      - 'tests/**'
      - 'scripts/**'
      - 'app/app.py'
      - 'app/bootstrap.py'
      - 'app/app.yaml'
      - 'notebooks/55_validate_consolidated_release_preflight.py'
      - 'notebooks/60_validate_persisted_release_candidate_read_paths.py'
      - 'sql/02_databricks_cost_audit.sql'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/local-regression.yml'
  pull_request:
    paths:
      - 'src/ikf/**'
      - 'tests/**'
      - 'scripts/**'
      - 'app/app.py'
      - 'app/bootstrap.py'
      - 'app/app.yaml'
      - 'notebooks/55_validate_consolidated_release_preflight.py'
      - 'notebooks/60_validate_persisted_release_candidate_read_paths.py'
      - 'sql/02_databricks_cost_audit.sql'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/local-regression.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local test tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Install IKF package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run deterministic IKF regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-diagnostic.log
      - name: Upload regression diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic
          path: pytest-diagnostic.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Build materialized App bundle
        run: python scripts/build_databricks_app_bundle.py --output build/ci_app
      - name: Check undefined names before cloud deployment
        run: python -m ruff check --select F821 build/ci_app/app.py src/ikf
