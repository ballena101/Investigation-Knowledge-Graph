name: IKF local regression

on:
  push:
    branches: [main]
    paths:
      - 'src/ikf/**'
      - 'tests/**'
      - 'scripts/**'
      - 'app/app.py'
      - 'app/bootstrap.py'
      - 'app/app.yaml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/local-regression.yml'
  pull_request:
    paths:
      - 'src/ikf/**'
      - 'tests/**'
      - 'scripts/**'
      - 'app/app.py'
      - 'app/bootstrap.py'
      - 'app/app.yaml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/local-regression.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install IKF package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run deterministic IKF regression suite
        run: python -m pytest -q
