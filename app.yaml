command:
  - streamlit
  - run
  - app.py

env:
  - name: NEO4J_URI
    valueFrom: neo4j_uri

  - name: NEO4J_USERNAME
    valueFrom: neo4j_username

  - name: NEO4J_PASSWORD
    valueFrom: neo4j_password

  - name: ANALYSIS_JOB_ID
    valueFrom: analysis_job

  - name: CLASS_D_ANALYSIS_JOB_ID
    valueFrom: class_d_analysis_job

  - name: ASK_JOB_ID
    valueFrom: ask_job

  - name: SHIELD_PROPOSAL_JOB_ID
    valueFrom: shield_proposal_job

  - name: RELATIONSHIP_CORRECTION_JOB_ID
    valueFrom: relationship_correction_job

  - name: SIMILAR_CASES_JOB_ID
    valueFrom: similar_cases_job

  - name: TRANSCRIPTION_JOB_ID
    valueFrom: transcription_job

  - name: CLASS_D_GPT20_ENDPOINT
    valueFrom: class_d_gpt20_endpoint

  - name: CLASS_D_LLAMA70_ENDPOINT
    valueFrom: class_d_llama70_endpoint

  # Temporary compatibility alias while legacy UI checks are retired.
  - name: CLASS_D_OLLAMA_LLAMA70_URL
    valueFrom: class_d_llama70_endpoint

  - name: DIRECT_TEXT_ENCRYPTION_KEY
    valueFrom: direct_text_encryption_key

  - name: IKG_ADMIN_USERS
    valueFrom: ikg_admin_users

  - name: LLAMA_DAILY_QUESTION_LIMIT
    value: "5"

  - name: NEWS_DASHBOARD_URL
    value: "https://adb-7405609619074273.13.azuredatabricks.net/dashboardsv3/01f1adf31a9718cfafc6bba8e50e77fb/published?o=7405609619074273"

  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"
