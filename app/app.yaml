command:
  - streamlit
  - run
  - app.py

env:
  - name: NEO4J_URI
    valueFrom: neo4j_uri

  - name: NEO4J_USERNAME
    valueFrom: neo4j_username

  - name: NEO4J_PASSWORD
    valueFrom: neo4j_password

  - name: SOURCE_VOLUME_PATH
    valueFrom: investigation_sources

  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"
